    <script>
      // Initialize AOS and simple Swiper init for elements with class init-swiper
      document.addEventListener('DOMContentLoaded', function() {
        if (window.AOS) AOS.init();
        // auto-init basic Swipers using config from data-config attribute or child element
        document.querySelectorAll('.init-swiper').forEach(function(sw) {
          let cfg = {};
          try {
            // 1) data-config attribute on the container
            const dataCfg = sw.getAttribute('data-config') || sw.dataset.config;
            if (dataCfg) cfg = JSON.parse(dataCfg);
            else {
              // 2) child element .swiper-config with textContent or data-config
              const cfgEl = sw.querySelector('.swiper-config');
              if (cfgEl) {
                const childCfg = cfgEl.getAttribute('data-config') || cfgEl.dataset.config || cfgEl.textContent;
                if (childCfg) cfg = JSON.parse(childCfg);
              }
            }
            new Swiper(sw, cfg);
          } catch (e) { console.warn('Swiper init failed', e); }
        });
        if (window.GLightbox) GLightbox();
      });
    </script>
  </body>
